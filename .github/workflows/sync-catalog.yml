name: Sync movie catalog

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-movie-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh catalog from four sources
        run: npm run sync:catalog
        env:
          DOOWISE_MEMBER_ID: ${{ secrets.DOOWISE_MEMBER_ID }}
          PROXY_SIGNING_KEY: ${{ secrets.DOOWISE_MEMBER_ID }}
          PROXY_BASE_URL: https://doowiseplay-proxy.kasthanakrit4.workers.dev

      - name: Commit updates
        shell: bash
        run: |
          if git diff --quiet -- data public/data; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data
          git commit -m "Update movie catalog"
          git push
